<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#1a1a2e"/>
  <!-- Valve bodies -->
  <rect x="10" y="20" width="12" height="30" rx="4" fill="#cd7f32"/>
  <rect x="26" y="20" width="12" height="30" rx="4" fill="#cd7f32"/>
  <rect x="42" y="20" width="12" height="30" rx="4" fill="#cd7f32"/>
  <!-- Valve caps (top buttons) -->
  <rect x="10" y="14" width="12" height="12" rx="4" fill="#d4a853"/>
  <rect x="26" y="14" width="12" height="12" rx="4" fill="#d4a853"/>
  <rect x="42" y="14" width="12" height="12" rx="4" fill="#d4a853"/>
  <!-- Shine on caps -->
  <rect x="12" y="15" width="4" height="3" rx="2" fill="#f5d48a" opacity="0.6"/>
  <rect x="28" y="15" width="4" height="3" rx="2" fill="#f5d48a" opacity="0.6"/>
  <rect x="44" y="15" width="4" height="3" rx="2" fill="#f5d48a" opacity="0.6"/>
</svg>
